name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # The same command Vercel runs: build, site check, design-foundation conformance.
      - run: node src/build.mjs && node src/check.mjs && node vendor/stack-ui/conformance.mjs --company --html dist --css src/styles.css
